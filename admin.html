<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin - InkMaster</title>
    <link rel="stylesheet" href="./assets/css/styles.css" />
  </head>
  <body>
    <div class="header">
      <div class="container header-inner">
        <a class="brand" href="/">Ink<span class="brand-accent">Master</span></a>
        <div class="nav">
          <a href="/">Home</a>
          <a href="/portfolio.html">Portfolio</a>
          <button id="logout" class="btn">Sair</button>
        </div>
      </div>
    </div>

    <div class="container" style="padding: 24px 0;">
      <div class="grid" style="grid-template-columns: 1fr 1fr; gap:24px;">
        <!-- JSON Config Editor -->
        <div class="card">
          <div class="card-body">
            <h3 style="margin:0 0 12px;">Configuração do Site (JSON)</h3>
            <textarea id="site-json" class="textarea" spellcheck="false" style="min-height: 360px;"></textarea>
            <div style="height: 8px;"></div>
            <button id="save-json" class="btn primary">Salvar Config</button>
          </div>
        </div>

        <!-- Portfolio Manager -->
        <div class="card">
          <div class="card-body">
            <h3 style="margin:0 0 12px;">Portfólio</h3>
            <div class="form-row">
              <label class="label">Imagem</label>
              <input class="input" id="file" type="file" accept="image/*" />
            </div>
            <div class="form-row">
              <label class="label">Título</label>
              <input class="input" id="title" placeholder="Geometric Wolf" />
            </div>
            <div class="form-row">
              <label class="label">Estilo</label>
              <input class="input" id="style" placeholder="Geometric" />
            </div>
            <div class="form-row">
              <label class="label">Ordem</label>
              <input class="input" id="order" type="number" value="1" />
            </div>
            <button id="add-item" class="btn primary">Adicionar</button>

            <div style="height: 16px;"></div>
            <table class="table" id="portfolio-table">
              <thead><tr><th>Título</th><th>Estilo</th><th>Ordem</th><th>Ações</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./assets/js/firebase-config.js"></script>
    <script type="module" src="./assets/js/firebase.js"></script>
    <script type="module">
      import { observeAuth, logout } from './assets/js/auth.js';
      import { getSiteConfig, saveSiteConfig, getPortfolioItems, addPortfolioItem, deletePortfolioItem, uploadImage } from './assets/js/data.js';

      const siteJson = document.getElementById('site-json');
      const saveBtn = document.getElementById('save-json');
      const tableBody = document.querySelector('#portfolio-table tbody');

      observeAuth((user)=>{
        if (!user){ location.href = '/login.html'; }
      });

      document.getElementById('logout').addEventListener('click', async ()=>{ await logout(); location.href = '/'; });

      async function loadConfig(){
        const cfg = await getSiteConfig();
        siteJson.value = JSON.stringify(cfg || { pages:{} }, null, 2);
      }

      async function loadPortfolio(){
        const items = await getPortfolioItems();
        tableBody.innerHTML = '';
        items.forEach(item=>{
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${item.title||''}</td><td>${item.style||''}</td><td>${item.order||0}</td><td><button data-id="${item.id}" class="btn">Remover</button></td>`;
          tableBody.appendChild(tr);
        });
        tableBody.querySelectorAll('button[data-id]').forEach(btn=>{
          btn.addEventListener('click', async ()=>{ await deletePortfolioItem(btn.getAttribute('data-id')); await loadPortfolio(); });
        });
      }

      saveBtn.addEventListener('click', async ()=>{
        try{
          const parsed = JSON.parse(siteJson.value || '{}');
          await saveSiteConfig(parsed);
          alert('Config salva');
        }catch(e){ alert('JSON inválido: '+(e?.message||e)); }
      });

      document.getElementById('add-item').addEventListener('click', async ()=>{
        const file = document.getElementById('file').files?.[0];
        const title = document.getElementById('title').value;
        const style = document.getElementById('style').value;
        const order = parseInt(document.getElementById('order').value||'1',10);
        let imageUrl = '';
        if (file){ imageUrl = await uploadImage(file, `portfolio/${Date.now()}-${file.name}`); }
        await addPortfolioItem({ title, style, imageUrl, order });
        await loadPortfolio();
      });

      loadConfig();
      loadPortfolio();
    </script>
  </body>
</html>
