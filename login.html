<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - InkMaster</title>
    <link rel="stylesheet" href="./assets/css/styles.css" />
  </head>
  <body>
    <div class="container" style="padding: 24px 0;">
      <div class="card" style="max-width: 420px; margin: 0 auto;">
        <div class="card-body">
          <h2 style="margin:0 0 12px;">Entrar</h2>
          <div class="form-row">
            <label class="label">Email</label>
            <input class="input" id="email" type="email" placeholder="voce@exemplo.com" />
          </div>
          <div class="form-row">
            <label class="label">Senha</label>
            <input class="input" id="password" type="password" placeholder="********" />
          </div>
          <button class="btn primary block" id="login-email">Entrar</button>
          <div style="height: 8px;"></div>
          <button class="btn block" id="login-google">Entrar com Google</button>
          <div style="height: 8px;"></div>
          <div style="color:#667085;">Não tem conta? <a href="/register.html">Cadastre-se</a></div>
        </div>
      </div>
    </div>

    <div id="app" style="display:none"></div>

    <script type="module" src="./assets/js/firebase-config.js"></script>
    <script type="module" src="./assets/js/firebase.js"></script>
    <script type="module">
      import { loginWithEmail, loginWithGoogle } from './assets/js/auth.js';
      const btnEmail = document.getElementById('login-email');
      const btnGoogle = document.getElementById('login-google');
      const email = document.getElementById('email');
      const password = document.getElementById('password');
      btnEmail.addEventListener('click', async ()=>{
        try{ await loginWithEmail(email.value, password.value); location.href = '/'; }
        catch(e){ alert('Falha no login: '+ (e?.message || e)); }
      });
      btnGoogle.addEventListener('click', async ()=>{
        try{ await loginWithGoogle(); location.href = '/'; }
        catch(e){ alert('Falha no login Google: '+ (e?.message || e)); }
      });
    </script>
  </body>
</html>
