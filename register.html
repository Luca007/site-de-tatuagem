<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cadastro - InkMaster</title>
    <link rel="stylesheet" href="./assets/css/styles.css" />
  </head>
  <body>
    <div class="container" style="padding: 24px 0;">
      <div class="card" style="max-width: 420px; margin: 0 auto;">
        <div class="card-body">
          <h2 style="margin:0 0 12px;">Criar conta</h2>
          <div class="form-row">
            <label class="label">Email</label>
            <input class="input" id="email" type="email" placeholder="voce@exemplo.com" />
          </div>
          <div class="form-row">
            <label class="label">Senha</label>
            <input class="input" id="password" type="password" placeholder="********" />
          </div>
          <button class="btn primary block" id="register-email">Cadastrar</button>
          <div style="height: 8px;"></div>
          <div style="color:#667085;">Já tem conta? <a href="/login.html">Entrar</a></div>
        </div>
      </div>
    </div>
    <script type="module" src="./assets/js/firebase-config.js"></script>
    <script type="module" src="./assets/js/firebase.js"></script>
    <script type="module">
      import { registerWithEmail } from './assets/js/auth.js';
      const email = document.getElementById('email');
      const password = document.getElementById('password');
      document.getElementById('register-email').addEventListener('click', async ()=>{
        try{ await registerWithEmail(email.value, password.value); location.href = '/'; }
        catch(e){ alert('Falha no cadastro: ' + (e?.message || e)); }
      });
    </script>
  </body>
</html>
